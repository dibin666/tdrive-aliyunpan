        const element = document.getElementById(id)
        return element ? element.checked : false
      }

      /** selectionChip summarises a job's ticked entries for the task list. */
      function selectionChip(job) {
        const dirs = (job.includeDirs || []).length
        const files = (job.includeFiles || []).length
        if (dirs + files === 0) return ''
        return (
          '只同步 ' +
          [dirs > 0 ? dirs + ' 个目录' : '', files > 0 ? files + ' 个文件' : '']
            .filter(Boolean)
            .join('、')
        )
      }

      function captureJobForm() {
        if (!state.editing) return
        // includeFiles and includeDirs have no input of their own — they come
        // from the picker — so they ride along on the spread rather than being
        // read back off the form.
        state.editing = {
          ...state.editing,
          name: value('job-name'),
          enabled: checked('job-enabled'),
          remotePath: value('job-remote'),
          targetPath: value('job-target'),
          driveName: value('job-drive') || 'backup',
          minSizeBytes: Math.round(Number(value('job-min') || 0) * 1048576),
          maxSizeBytes: Math.round(Number(value('job-max') || 0) * 1048576),
          excludeNames: value('job-exclude')
            .split(',')
            .map((item) => item.trim())
            .filter(Boolean),
          overwrite: checked('job-overwrite'),
          deleteAfterUpload: checked('job-delete'),
        }
      }

      async function saveJob() {
        captureJobForm()
        const job = state.editing
        if (job.deleteAfterUpload && !window.confirm('这个任务会在文件成功写入 tdrive 之后删除阿里云盘上的原文件。删除不可撤销，确定要开启吗？')) {
          return
        }
        try {
          await call('/jobs', { method: 'POST', body: JSON.stringify(job) })
          state.editing = null
          renderOverlay(true)
          toast('任务已保存')
          await load(true)
        } catch (error) {
          toast(error.message, 'error')
        }
      }

      async function savePlan() {
        await loadSettings()
        if (!state.settings) return
        const gib = Number(value('quota-gib') || 0)
        const stageGib = Number(value('stage-limit') || 0)
        const downloadConcurrency = Math.round(Number(value('aliyunpan-download-concurrency') || 0))
        const next = {
          ...state.settings,
          stageDir: value('stage-dir'),
          stageLimitBytes: Math.round(stageGib * 1073741824),
          ownerUserId: value('owner'),
          downloadRate: value('download-rate'),
          downloadConcurrency,
          deleteLocalAfterUpload: checked('delete-local-after-upload'),
          retry: {
            maxAttempts: Math.round(Number(value('retry-attempts') || 5)),
            initialSeconds: Math.round(Number(value('retry-initial') || 30)),
            maxSeconds: Math.round(Number(value('retry-max') || 1800)),
          },
          schedule: {
            ...state.settings.schedule,
            enabled: checked('schedule-enabled'),
            windowStart: value('window-start'),
            windowEnd: value('window-end'),
            intervalMinutes: Number(value('interval') || 15),
          },
          quota: {
            dailyBytes: Math.round(gib * 1073741824),
            resetAt: value('quota-reset') || '00:00',
          },
        }
        try {
          state.settings = await call('/settings', { method: 'PUT', body: JSON.stringify(next) })
          state.planDirty = true
          toast('已保存')
          await load(true)
        } catch (error) {
          toast(error.message, 'error')
        }
      }

      /**
       * togglePicked ticks or unticks one cloud entry.
       *
       * What was ticked is remembered along with whether it was a file or a
       * directory, because the picker only ever sees one directory's entries at
       * a time and the two are synced differently — a file by name, a directory
       * whole. Re-deriving the kind later would mean another round trip per tick.
       */
      function togglePicked(path, isDir) {
        if (state.picker.chosen.has(path)) state.picker.chosen.delete(path)
        else state.picker.chosen.set(path, isDir ? 'dir' : 'file')
      }

      /**
       * openPicker browses one directory.
       *
       * The cloud side lists files as well as directories so specific files or
       * whole folders can be ticked; the tdrive side is a destination and only
       * ever a directory. The ticks survive navigating around, because what
       * somebody wants is rarely all in one folder.
       */
      async function openPicker(kind, path) {
        const selectedPath = path || '/'
        const driveName = state.editing && state.editing.driveName ? state.editing.driveName : 'backup'
        const request = ++state.pickerRequest
        const chosen =
          state.picker && state.picker.kind === kind
            ? state.picker.chosen
            : pickedFromJob(kind === 'remote' ? state.editing : null)
        state.picker = {
          request, kind, driveName, chosen,
          path: selectedPath, loading: true, entries: [], error: '',
        }
        renderOverlay(true)
        const endpoint = kind === 'remote' ? '/browse' : '/drive/browse'
        try {
          const result = await call(
            endpoint +
              '?path=' +
              encodeURIComponent(selectedPath) +
              (kind === 'remote' ? '&driveName=' + encodeURIComponent(driveName) : ''),
          )
          const entries = (result.entries || []).filter((entry) => kind === 'remote' || entry.isDir)
          if (!state.picker || state.picker.request !== request) return
          state.picker = { ...state.picker, path: result.path, entries, loading: false }
        } catch (error) {
          if (!state.picker || state.picker.request !== request) return
          state.picker = { ...state.picker, loading: false, error: error.message }
        }
        renderOverlay(true)
      }

      /** pickedFromJob restores a job's ticks as the picker records them. */
      function pickedFromJob(job) {
        const picked = new Map()
        if (!job) return picked
        ;(job.includeFiles || []).forEach((path) => picked.set(path, 'file'))
        ;(job.includeDirs || []).forEach((path) => picked.set(path, 'dir'))
        return picked
      }

      /**
       * applyPicker writes the picker's result back into the job form.
       *
       * Ticking something means "sync exactly this"; ticking nothing means
       * "mirror this directory", which is what the job did before any of this
       * existed. All of it is recorded together so the halves cannot disagree:
       * the cloud directory is always the one being looked at when the choice
       * was made.
       */
      function applyPicker() {
        if (!state.picker || !state.editing) return
        if (state.picker.kind !== 'remote') {
          state.editing.targetPath = state.picker.path
          state.picker = null
          renderOverlay(true)
          return
        }

        const chosen = [...state.picker.chosen.keys()]
        if (chosen.length === 0) {
          state.editing.remotePath = state.picker.path
          state.editing.includeFiles = []
          state.editing.includeDirs = []
        } else {
          // The job's directory has to contain everything ticked, or the server
          // rejects the job. The deepest shared ancestor is the only choice that
          // always does and never pulls in more of the tree than it must.
          state.editing.remotePath = commonCloudDir(chosen)
          state.editing.includeFiles = chosen.filter((path) => state.picker.chosen.get(path) === 'file')
          state.editing.includeDirs = chosen.filter((path) => state.picker.chosen.get(path) === 'dir')
        }
        state.picker = null
        renderOverlay(true)
      }

      /** commonCloudDir is the deepest directory holding every given path. */
      function commonCloudDir(paths) {
        let parts = parentOf(paths[0]).split('/')
        for (const path of paths.slice(1)) {
          const other = parentOf(path).split('/')
          let index = 0
          while (index < parts.length && index < other.length && parts[index] === other[index]) index++
          parts = parts.slice(0, index)
        }
        const joined = parts.join('/')
        return joined === '' ? '/' : joined
      }

      // Follow the main interface when the theme is changed in another tab.
      window.addEventListener('storage', (event) => {
        if (event.key !== 'tdrive.theme') return
        const stored = localStorage.getItem('tdrive.theme')
        const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })

      renderTabs()
      if (state.tab === 'plan') loadSettings().then(() => load(true))
      else load(true)
    </script>
  </body>
</html>
