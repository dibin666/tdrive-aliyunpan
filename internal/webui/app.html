<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>阿里云盘同步</title>
    <script>
      // The same pre-paint snippet tdrive's own shell uses. This page is
      // same-origin, so it reads the identical localStorage key and a reload
      // in dark mode never flashes the light background.
      ;(function () {
        try {
          var stored = localStorage.getItem('tdrive.theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <script>
      // tdrive fingerprints its stylesheet, so the href cannot be hard-coded.
      // The app shell is served without authentication, which makes reading
      // the current hash out of it the cheapest way to stay in step with the
      // main interface across rebuilds. The fallback below keeps the page
      // usable if that ever fails.
      ;(function () {
        fetch('/', { credentials: 'same-origin' })
          .then(function (response) {
            return response.ok ? response.text() : ''
          })
          .then(function (html) {
            var match = html.match(/href="(\/assets\/index-[^"]+\.css)"/)
            if (!match) return
            var link = document.createElement('link')
            link.rel = 'stylesheet'
            link.href = match[1]
            document.head.appendChild(link)
          })
          .catch(function () {})
      })()
    </script>
    <style>
      /* Fallback tokens, overwritten the moment tdrive's stylesheet lands.
         They exist so a failed fetch degrades to something readable rather
         than to unstyled HTML. */
      :root {
        --bg: #faf9f5;
        --surface: #fff;
        --sunk: #f2f0e9;
        --line: #e5e3dc;
        --line-strong: #d5d2c7;
        --ink: #1f1e1d;
        --muted: #6b6963;
        --faint: #97948b;
        --clay-soft: #f4e6df;
        --danger-soft: #f6e3de;
        --color-clay: #d97757;
        --color-danger: #b4462f;
        --color-success: #4a7c59;
        --color-warn: #a2762f;
        --radius-control: 8px;
        --radius-card: 12px;
        --radius-panel: 16px;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html.dark {
        --bg: #262624;
        --surface: #30302e;
        --sunk: #212120;
        --line: #3d3d3a;
        --line-strong: #4d4d49;
        --ink: #f5f4ee;
        --muted: #a3a096;
        --faint: #7c7a72;
        --clay-soft: #3a2a24;
        --danger-soft: #3b241f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
      }

      /* Layout. Everything below composes tdrive's component classes with the
         same variables, so it inherits the interface's palette rather than
         re-stating it. */
      .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--line);
      }
      .topbar h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 500;
      }
      .status-line {
        font-size: 0.8125rem;
        color: var(--muted);
        min-width: 0;
        flex: 1;
      }
      .tabs {
        display: flex;
        gap: 0.25rem;
        padding: 0.5rem 1rem 0;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
      }
      .tab {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 0.875rem;
        padding: 0.5rem 0.75rem;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab[data-active='true'] {
        color: var(--ink);
        border-bottom-color: var(--color-clay);
        font-weight: 500;
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .page {
        max-width: 60rem;
        margin: 0 auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .section-title {
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--muted);
        margin: 0 0 0.5rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 0.875rem 1rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
        gap: 0.75rem;
      }
      .stat {
        background: var(--sunk);
        border-radius: var(--radius-control);
        padding: 0.5rem 0.75rem;
      }
      .stat .k {
        font-size: 0.6875rem;
        color: var(--faint);
      }
      .stat .v {
        font-size: 0.9375rem;
        margin-top: 0.125rem;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .filter {
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--sunk);
        color: var(--muted);
        font-size: 0.6875rem;
        padding: 0.1875rem 0.5rem;
        border-radius: 999px;
      }
      .filter[data-active='true'] {
        background: var(--clay-soft);
        color: var(--color-clay);
        border-color: transparent;
      }
      .grow {
        flex: 1;
      }
      /* An .input is full-width by design, which would push the button next to
         it onto its own line inside a toolbar row. */
      .toolbar .input {
        flex: 1;
        width: auto;
        min-width: 10rem;
      }

      /* Transfer rows. Progress is the row's own background rather than a
         separate bar — the same choice tdrive's 传输 page makes, and the
         reason a compact row still shows how far along it is. */
      .rows {
        display: flex;
        flex-direction: column;
      }
      .trow {
        position: relative;
        border-bottom: 1px solid var(--line);
        padding: 0.6875rem 0.75rem;
        cursor: pointer;
      }
      .rows[data-density='compact'] .trow {
        padding: 0.375rem 0.75rem;
      }
      .trow:last-child {
        border-bottom: 0;
      }
      .trow .fill {
        position: absolute;
        inset-block: 0;
        left: 0;
        background: var(--clay-soft);
        opacity: 0.6;
        transition: width 200ms linear;
      }
      .trow .body {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.625rem;
        min-width: 0;
      }
      .trow .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.875rem;
      }
      .trow .meta {
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .icon {
        width: 1rem;
        height: 1rem;
        flex: none;
        color: var(--muted);
      }
      .icon.ok {
        color: var(--color-success);
      }
      .icon.bad {
        color: var(--color-danger);
      }
      .icon.run {
        color: var(--color-clay);
        animation: spin 1.6s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .detail {
        position: relative;
        margin-top: 0.5rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
        gap: 0.375rem 1rem;
        font-size: 0.75rem;
      }
      .detail dt {
        color: var(--faint);
      }
      .detail dd {
        margin: 0.0625rem 0 0;
        color: var(--muted);
        word-break: break-all;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 0.875rem;
        padding: 2rem 0;
      }
      .form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        gap: 0.75rem;
      }
      .field-wide {
        grid-column: 1 / -1;
      }
      .hint {
        font-size: 0.75rem;
        color: var(--faint);
        margin-top: 0.25rem;
      }
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        cursor: pointer;
      }
      .danger-text {
        color: var(--color-danger);
      }
      .warn-box {
        background: var(--clay-soft);
        color: var(--color-clay);
        border-radius: var(--radius-control);
        padding: 0.5rem 0.75rem;
        font-size: 0.8125rem;
      }
      .error-box {
        background: var(--danger-soft);
        color: var(--color-danger);
        border-radius: var(--radius-control);
        padding: 0.5rem 0.75rem;
        font-size: 0.8125rem;
        word-break: break-all;
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        word-break: break-all;
      }
      .picker {
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        max-height: 15rem;
        overflow-y: auto;
      }
      .picker button {
        display: flex;
        width: 100%;
        gap: 0.5rem;
        align-items: center;
        border: 0;
        background: transparent;
        color: var(--ink);
        text-align: left;
        font-size: 0.8125rem;
        padding: 0.4375rem 0.625rem;
        cursor: pointer;
      }
      .picker button:hover {
        background: var(--sunk);
      }
      .picker .size {
        margin-left: auto;
        color: var(--faint);
        font-size: 0.75rem;
        white-space: nowrap;
      }
      /* A directory can be both entered and ticked, so its row is two targets
         rather than the one row-wide button a file gets. */
      .picker-row {
        display: flex;
        align-items: center;
      }
      .picker-row:hover {
        background: var(--sunk);
      }
      .picker .picker-row .check-hit {
        width: auto;
        margin: 0;
        padding: 0.4375rem 0 0.4375rem 0.625rem;
      }
      .picker .picker-row button[data-picker-go] {
        padding-left: 0.5rem;
      }

      /* The multi-select box, drawn rather than native so it can show the
         indeterminate state a partly-selected "select all" needs, and so it
         matches tdrive's own lists. */
      .check {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1rem;
        height: 1rem;
        flex: none;
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        background: transparent;
        color: #fff;
        font-size: 0.625rem;
        line-height: 1;
        cursor: pointer;
        padding: 0;
      }
      .check[data-on='true'],
      .check[data-on='mixed'] {
        background: var(--color-clay);
        border-color: var(--color-clay);
      }
      /* A 16px box is not a target. The padded wrapper is. */
      .check-hit {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.375rem;
        margin: -0.375rem;
        background: transparent;
        border: 0;
        cursor: pointer;
        flex: none;
      }
      .select-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--line);
        background: var(--clay-soft);
        font-size: 0.8125rem;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgb(0 0 0 / 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 50;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        width: min(38rem, 100%);
        max-height: 90vh;
        overflow-y: auto;
        padding: 1rem 1.125rem;
      }
      .modal h2 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        font-weight: 500;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 1.25rem;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-control);
        padding: 0.5rem 0.875rem;
        font-size: 0.8125rem;
        z-index: 60;
        max-width: 90vw;
      }
      .toast[data-tone='error'] {
        border-color: var(--color-danger);
        color: var(--color-danger);
      }
      .job-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 0;
        border-bottom: 1px solid var(--line);
      }
      .job-row:last-child {
        border-bottom: 0;
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: var(--faint);
        flex: none;
      }
      .dot[data-on='true'] {
        background: var(--color-success);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <h1 class="display">阿里云盘同步</h1>
        <span class="status-line" id="status">加载中…</span>
        <button class="btn btn-outline" id="scan-btn" type="button">立即扫描</button>
        <button class="btn btn-outline" id="pause-btn" type="button">暂停</button>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="scroll"><div class="page" id="page"></div></div>
    </div>
    <div id="overlay"></div>
    <div id="toast-host"></div>

    <script type="module">
      // The page can be opened with or without a trailing slash. A relative
      // `./api` would resolve to /plugins/api in the former case, which makes
      // a direct link look like a broken plugin even though / itself works.
      const API = (location.pathname.replace(/\/+$/, '') || '/') + '/api'
      const TABS = [
        ['sync', '同步'],
        ['downloads', '下载文件'],
        ['jobs', '任务'],
        ['plan', '计划与限额'],
        ['account', '账号'],
      ]

      // The cadence is lifted from tdrive's 传输 page so the two feel like one
      // interface: a live snapshot's speed is stale after five seconds, a
      // reload is coalesced to at most one per 1.2s, and an active transfer is
      // polled every two seconds. A plugin route cannot stream events — the
      // host buffers a whole response and caps a call at thirty seconds — so
      // polling stands in for the core page's event subscription.
      const LIVE_SPEED_TTL = 5000
      const RELOAD_INTERVAL = 1200
      const ACTIVE_POLL_INTERVAL = 2000
      const IDLE_POLL_INTERVAL = 6000

      const STATUS_LABEL = {
        pending: '排队中',
        running: '进行中',
        complete: '已完成',
        failed: '失败',
        cancelled: '已取消',
      }
      const STAGE_LABEL = {
        downloading: '下载中',
        'waiting-upload': '等待上传',
        uploading: '上传中',
        finishing: '收尾中',
      }

      // Stages whose progress is measured against Telegram rather than disk.
      // Everything else — including a finished download waiting for an upload
      // slot — is still described by how much of the file is on local disk.
      const UPLOAD_STAGES = new Set(['uploading', 'finishing'])

      const state = {
        tab: localStorage.getItem('tdrive.aliyunpan.tab') || 'sync',
        snapshot: null,
        settings: null,
        filters: new Set(),
        jobFilter: '',
        expanded: new Set(),
        // Ids of the queue rows that are ticked. Kept here rather than in the
        // DOM because the list repaints on every poll.
        selected: new Set(),
        // The 下载文件 tab has its own snapshot and its own ticks. It walks the
        // staging tree on the server, so it is fetched only while that tab is
        // open rather than riding along on the queue's poll.
        downloads: null,
        stagedSelected: new Set(),
        density: localStorage.getItem('tdrive.transferDensity') || 'compact',
        loading: false,
        lastLoad: 0,
        editing: null,
        picker: null,
        pickerRequest: 0,
        planDirty: false,
      }

      // renderedTab and overlayKey stop the poll from repainting DOM that
      // currently holds user input.
      let renderedTab = ''
      let overlayKey = ''

      // ---------------------------------------------------------------- utils

      function esc(value) {
        return String(value ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        )
      }

      function bytes(n) {
        if (!n && n !== 0) return '—'
        if (n < 1024) return n + ' B'
        const units = ['KiB', 'MiB', 'GiB', 'TiB', 'PiB']
        let value = n / 1024
        let index = 0
        while (value >= 1024 && index < units.length - 1) {
          value /= 1024
          index++
        }
        return value.toFixed(value >= 100 ? 0 : 1) + ' ' + units[index]
      }

      function rate(n) {
        return n > 0 ? bytes(n) + '/s' : '—'
      }

      function clock(ms) {
        if (!ms) return '—'
        const date = new Date(ms)
        return date.toLocaleString('zh-CN', { hour12: false })
      }

      function duration(ms) {
        if (!ms || ms < 0) return '—'
        const total = Math.round(ms / 1000)
        if (total < 60) return total + ' 秒'
        if (total < 3600) return Math.floor(total / 60) + ' 分 ' + (total % 60) + ' 秒'
        return Math.floor(total / 3600) + ' 小时 ' + Math.floor((total % 3600) / 60) + ' 分'
      }

      // retryCountdown describes the wait left before an automatic retry. The
      // deadline can already have passed, because the scheduler only looks
      // every thirty seconds; "—后重试" is not a sentence, so that case gets its
      // own wording.
      function retryCountdown(remaining) {
        return remaining > 0 ? duration(remaining) + '后重试' : '即将重试'
      }

      function liveSpeed(row, now) {
        if (!row.speedAt) return 0
        return now - row.speedAt < LIVE_SPEED_TTL ? row.speed || 0 : 0
      }

      const DRIVE_LABEL = { backup: '备份盘', resource: '资源库' }

      function driveLabel(value) {
        return DRIVE_LABEL[value] || value || '备份盘'
      }

      function driveOptions(selected) {
        const drives = (state.snapshot && state.snapshot.account && state.snapshot.account.drives) || []
        const known = new Set(drives.map((drive) => drive.kind))
        return ['backup', 'resource']
          .map((kind) => {
            const unavailable = known.size > 0 && !known.has(kind)
            return (
              '<option value="' +
              kind +
              '"' +
              (selected === kind ? ' selected' : '') +
              (unavailable ? ' disabled' : '') +
              '>' +
              esc(driveLabel(kind)) +
              (unavailable ? '（当前账号不可用）' : '') +
              '</option>'
            )
          })
          .join('')
      }

      let toastTimer = null
      function toast(message, tone) {
        const host = document.getElementById('toast-host')
        host.innerHTML =
          '<div class="toast" data-tone="' + esc(tone || 'info') + '">' + esc(message) + '</div>'
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => (host.innerHTML = ''), 4000)
      }

      async function call(path, options) {
        const response = await fetch(API + path, {
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          ...options,
        })
        const text = await response.text()
        let payload = null
        try {
          payload = text ? JSON.parse(text) : null
        } catch (error) {
          throw new Error(text.slice(0, 300) || response.statusText)
        }
        if (!response.ok) throw new Error((payload && payload.error) || response.statusText)
        return payload
      }

      // ---------------------------------------------------------------- load

      let pollTimer = null

      async function load(force) {
        const now = Date.now()
        if (!force && (state.loading || now - state.lastLoad < RELOAD_INTERVAL)) return
        state.loading = true
        try {
          state.snapshot = await call('/state')
          // The staging walk is only paid for while the tab that shows it is
          // open. A failure there must not take the whole page down with it.
          if (state.tab === 'downloads') {
            try {
              state.downloads = await call('/downloads')
            } catch (error) {
              toast(error.message, 'error')
            }
          }
          state.lastLoad = Date.now()
          render()
        } catch (error) {
          document.getElementById('status').textContent = '读取状态失败：' + error.message
        } finally {
          state.loading = false
        }
        schedulePoll()
      }

      function schedulePoll() {
        clearTimeout(pollTimer)
        const snapshot = state.snapshot
        const busy =
          snapshot &&
          (snapshot.summary.active > 0 ||
            snapshot.scan.scanning ||
            (snapshot.login && snapshot.login.active))
        pollTimer = setTimeout(() => load(true), busy ? ACTIVE_POLL_INTERVAL : IDLE_POLL_INTERVAL)
      }

      async function act(path, options, message) {
        try {
          await call(path, { method: 'POST', ...(options || {}) })
          if (message) toast(message, 'info')
          await load(true)
        } catch (error) {
          toast(error.message, 'error')
        }
      }

      // ---------------------------------------------------------------- views

      function renderTabs() {
        document.getElementById('tabs').innerHTML = TABS.map(
          ([id, label]) =>
            '<button class="tab" data-tab="' +
            id +
            '" data-active="' +
            (state.tab === id) +
            '">' +
            label +
            '</button>',
        ).join('')
      }

      function render() {
        renderTabs()
        const snapshot = state.snapshot
        if (!snapshot) return
        document.getElementById('status').textContent = snapshot.status
        const pause = document.getElementById('pause-btn')
        pause.textContent = snapshot.paused ? '继续' : '暂停'
        pause.dataset.paused = String(snapshot.paused)

        const page = document.getElementById('page')
        if (state.tab === 'plan') {
          // The plan tab is a form. Repainting it on the poll interval would
          // wipe whatever the administrator was halfway through typing, so it
          // is drawn when the tab is entered and after a save, not on a timer.
          if (renderedTab !== 'plan' || state.planDirty) {
            page.innerHTML = planView(snapshot)
            state.planDirty = false
          }
        } else if (state.tab === 'sync') {
          page.innerHTML = syncView(snapshot)
        } else if (state.tab === 'downloads') {
          page.innerHTML = downloadsView(snapshot)
        } else if (state.tab === 'jobs') {
          page.innerHTML = jobsView(snapshot)
        } else {
          page.innerHTML = accountView(snapshot)
        }
        renderedTab = state.tab
        renderOverlay()
      }

      function syncView(snapshot) {
        const now = Date.now()
        const summary = snapshot.summary
        const quota = snapshot.quota
        const rows = snapshot.rows
          .filter((row) => (state.filters.size === 0 ? true : state.filters.has(row.state)))
          .filter((row) => (state.jobFilter ? row.jobId === state.jobFilter : true))
          .slice()
          .sort(sortRows)

        const quotaPercent =
          quota.dailyBytes > 0 ? Math.min(100, (quota.usedBytes / quota.dailyBytes) * 100) : 0

        return [
          '<div class="card">',
          '<div class="stats">',
          stat('进行中', String(summary.active)),
          stat(
            '排队中',
            summary.retrying > 0
              ? summary.pending + '（' + summary.retrying + ' 个等待重试）'
              : String(summary.pending),
          ),
          stat('上传速度', rate(summary.uploadSpeed)),
          stat('下载速度', rate(summary.downloadSpeed)),
          stat('今日完成', summary.todayCount + ' 个 · ' + bytes(summary.todayBytes)),
          stat(
            '今日配额',
            quota.dailyBytes > 0
              ? bytes(quota.usedBytes) + ' / ' + bytes(quota.dailyBytes)
              : bytes(quota.usedBytes) + '（不限）',
          ),
          '</div>',
          quota.dailyBytes > 0
            ? '<div style="margin-top:.75rem;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden">' +
              '<div style="height:100%;width:' +
              quotaPercent.toFixed(1) +
              '%;background:var(--color-clay)"></div></div>' +
              '<div class="hint">配额在 ' +
              esc(clock(quota.resetAt)) +
              ' 重置，剩余 ' +
              esc(bytes(quota.remaining)) +
              '</div>'
            : '',
          quota.oversize
            ? '<div class="warn-box" style="margin-top:.75rem">队列里有单个文件大于一整天的配额。这样的文件会在配额尚未使用的日子里单独放行，否则它会永远排不上队。</div>'
            : '',
          snapshot.scan.error
            ? '<div class="error-box" style="margin-top:.75rem">扫描出错：' +
              esc(snapshot.scan.error) +
              '</div>'
            : '',
          '</div>',

          '<div class="toolbar">',
          ['pending', 'running', 'complete', 'failed', 'cancelled']
            .map(
              (key) =>
                '<button class="filter" data-filter="' +
                key +
                '" data-active="' +
                state.filters.has(key) +
                '">' +
                STATUS_LABEL[key] +
                '</button>',
            )
            .join(''),
          '<select class="input" id="job-filter" style="width:auto;padding:.3rem .5rem;font-size:.75rem">',
          '<option value="">全部任务</option>',
          (snapshot.jobs || [])
            .map(
              (job) =>
                '<option value="' +
                esc(job.id) +
                '"' +
                (state.jobFilter === job.id ? ' selected' : '') +
                '>' +
                esc(job.name) +
                '</option>',
            )
            .join(''),
          '</select>',
          '<span class="grow"></span>',
          '<button class="btn btn-ghost" id="density-btn" type="button">',
          state.density === 'compact' ? '宽松' : '紧凑',
          '</button>',
          '<button class="btn btn-ghost" id="clear-btn" type="button">清空历史</button>',
          '</div>',

          '<div class="card" style="padding:0">',
          rows.length === 0
            ? '<div class="empty">没有符合条件的传输</div>'
            : selectionBar(rows) +
              '<div class="rows" data-density="' +
                state.density +
                '">' +
                rows.map((row) => transferRow(row, now, snapshot.now || now)).join('') +
                '</div>',
          '</div>',
          '<div class="hint">暂存目录 ' +
            esc(snapshot.stageDir) +
            '，上限 ' +
            (snapshot.limits.stageLimit > 0 ? esc(bytes(snapshot.limits.stageLimit)) : '不限') +
            '。</div>',
        ].join('')
      }

      function sortRows(a, b) {
        const rank = { running: 0, pending: 1, failed: 2, cancelled: 3, complete: 4 }
        const delta = (rank[a.state] ?? 9) - (rank[b.state] ?? 9)
        if (delta !== 0) return delta
        return (b.finishedAt || b.startedAt || b.createdAt) - (a.finishedAt || a.startedAt || a.createdAt)
      }

      function stat(key, value) {
        return '<div class="stat"><div class="k">' + esc(key) + '</div><div class="v">' + esc(value) + '</div></div>'
      }

      const ICONS = {
        pending:
          '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
        running:
          '<svg class="icon run" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>',
        complete:
          '<svg class="icon ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m20 6-11 11-5-5"/></svg>',
        failed:
          '<svg class="icon bad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
        cancelled:
          '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6 18.4 18.4"/></svg>',
      }

      /**
       * selectionBar heads the queue with a select-all box and, once something
       * is ticked, the actions that apply to every ticked row.
       *
       * Cancelling or retrying a hundred queued files one row at a time was the
       * only way to do it, which in practice meant not doing it.
       */
      function selectionBar(rows) {
        // Only what is on screen can be selected, so "all" means the current
        // filter rather than the whole queue.
        const visible = rows.map((row) => row.id)
        const chosen = visible.filter((id) => state.selected.has(id))
        const stateOf = chosen.length === 0 ? 'false' : chosen.length === visible.length ? 'true' : 'mixed'

        const selectedRows = rows.filter((row) => state.selected.has(row.id))
        const stoppable = selectedRows.filter((row) => !FINISHED_STATES.has(row.state)).length
        const retryable = selectedRows.filter((row) => row.state !== 'running' && row.state !== 'complete').length
        const removable = selectedRows.filter((row) => FINISHED_STATES.has(row.state)).length

        return [
          '<div class="select-bar">',
          checkbox(stateOf, 'select-all-rows', chosen.length === visible.length ? '取消全选' : '全选'),
          chosen.length > 0
            ? '<span>已选 ' + chosen.length + ' / ' + visible.length + ' 项</span>'
            : '<span style="color:var(--muted)">' + visible.length + ' 项</span>',
          '<span class="grow"></span>',
          chosen.length > 0
            ? [
                retryable > 0
                  ? '<button class="btn btn-ghost" id="bulk-retry" type="button" style="padding:.25rem .5rem;font-size:.75rem">重试 ' + retryable + ' 项</button>'
                  : '',
                stoppable > 0
                  ? '<button class="btn btn-ghost" id="bulk-cancel" type="button" style="padding:.25rem .5rem;font-size:.75rem">取消 ' + stoppable + ' 项</button>'
                  : '',
                removable > 0
                  ? '<button class="btn btn-danger" id="bulk-delete" type="button" style="padding:.25rem .5rem;font-size:.75rem">删除 ' + removable + ' 条记录</button>'
                  : '',
                '<button class="btn btn-ghost" id="clear-selection" type="button" style="padding:.25rem .5rem;font-size:.75rem">取消选择</button>',
              ].join('')
            : '',
          '</div>',
        ].join('')
      }

      // States a transfer never leaves. Cancelling one is meaningless and
      // deleting a running one would orphan its goroutine.
      const FINISHED_STATES = new Set(['complete', 'failed', 'cancelled'])

      /** checkbox renders one drawn box. `on` is 'true', 'false' or 'mixed'. */
      function checkbox(on, id, label, dataset) {
        return (
          '<button class="check-hit" type="button"' +
          (id ? ' id="' + esc(id) + '"' : '') +
          (dataset ? ' data-check="' + esc(dataset) + '"' : '') +
          ' aria-label="' + esc(label) + '" title="' + esc(label) + '">' +
          '<span class="check" data-on="' + on + '">' +
          (on === 'mixed' ? '–' : on === 'true' ? '✓' : '') +
          '</span></button>'
        )
      }

      // serverNow is the snapshot's own clock. A retry countdown is measured
      // against it rather than the browser's, because the deadline was written
      // by the server and the two clocks do not have to agree.
      function transferRow(row, now, serverNow) {
        // The bar tracks whichever half is running: disk on the way in,
        // Telegram on the way out. Mixing them into one number would make a
        // finished download look like a half-finished upload. A row that is
        // pending, queued, or holding a staged file keeps showing its download
        // figure, so a transfer waiting its turn does not read as 0%.
        const measured = UPLOAD_STAGES.has(row.stage) ? row.done : row.downloaded
        const percent = row.total > 0 ? Math.min(100, (measured / row.total) * 100) : 0
        const speed = liveSpeed(row, now)
        const expanded = state.expanded.has(row.id)
        const elapsed = row.finishedAt && row.startedAt ? row.finishedAt - row.startedAt : 0
        const average = elapsed > 0 ? (row.total / elapsed) * 1000 : 0
        const waiting = row.state === 'pending' && row.nextAttemptAt > serverNow

        return [
          '<div class="trow" data-row="' + esc(row.id) + '">',
          percent > 0 ? '<div class="fill" style="width:' + percent.toFixed(1) + '%"></div>' : '',
          '<div class="body">',
          checkbox(
            state.selected.has(row.id) ? 'true' : 'false',
            '',
            (state.selected.has(row.id) ? '取消选择 ' : '选择 ') + row.name,
            row.id,
          ),
          ICONS[row.state] || ICONS.pending,
          '<span class="name" title="' + esc(row.remotePath) + '">' + esc(row.name) + '</span>',
          '<span class="chip">' + esc(row.jobName || '任务') + '</span>',
          '<span class="meta">',
          row.state === 'running'
            ? esc((STAGE_LABEL[row.stage] || '进行中') + ' · ' + bytes(measured) + ' / ' + bytes(row.total)) +
              (speed > 0 ? ' · ' + esc(rate(speed)) : '')
            : waiting
              ? // A pending row carrying an error is a retry in its backoff.
                // Labelling it 排队中 made an automatic retry look like a queue
                // that had simply stopped moving.
                esc(
                  '第 ' + row.attempts + '/' + row.maxAttempts + ' 次失败，' +
                    retryCountdown(row.nextAttemptAt - serverNow) + ' · ' + bytes(row.total),
                )
              : esc(STATUS_LABEL[row.state] + ' · ' + bytes(row.total)),
          '</span>',
          row.state === 'failed' || row.state === 'cancelled'
            ? '<button class="btn btn-ghost" data-retry="' + esc(row.id) + '" style="padding:.25rem .5rem;font-size:.75rem">重试</button>'
            : waiting
              ? // Skipping the backoff is the natural thing to want once the
                // operator has fixed whatever broke, and it also hands the row
                // a fresh attempt budget.
                '<button class="btn btn-ghost" data-retry="' + esc(row.id) + '" style="padding:.25rem .5rem;font-size:.75rem">立即重试</button>'
              : '',
          // Offered for a running transfer too, now that cancelling one
          // actually stops it rather than being refused.
          !FINISHED_STATES.has(row.state)
            ? '<button class="btn btn-ghost" data-cancel="' + esc(row.id) + '" style="padding:.25rem .5rem;font-size:.75rem">取消</button>'
            : '',
          '</div>',
          expanded
            ? '<dl class="detail">' +
              detail('云端路径', row.remotePath) +
              detail('网盘', driveLabel(row.driveName)) +
              detail('目标路径', row.targetPath) +
              detail('状态', STATUS_LABEL[row.state] + (row.stage ? ' · ' + (STAGE_LABEL[row.stage] || '') : '')) +
              detail('已下载', bytes(row.downloaded)) +
              detail('已上传', bytes(row.done)) +
              detail('开始', clock(row.startedAt)) +
              detail('用时', duration(elapsed)) +
              detail('平均速度', average > 0 ? rate(average) : '—') +
              detail('尝试次数', row.maxAttempts > 0 ? row.attempts + ' / ' + row.maxAttempts : String(row.attempts)) +
              (waiting ? detail('下次重试', clock(row.nextAttemptAt)) : '') +
              detail('创建', clock(row.createdAt)) +
              (row.error ? detail('错误', row.error) : '') +
              '</dl>'
            : '',
          '</div>',
        ].join('')
      }

      function detail(key, value) {
        return '<div><dt>' + esc(key) + '</dt><dd>' + esc(value) + '</dd></div>'
      }

      // -------------------------------------------------------- downloads tab

      /**
       * downloadsView lists what the plugin is holding on local disk.
       *
       * A failed upload no longer deletes the file it downloaded, which is what
       * makes retrying one cheap — and what makes the staging area something
       * that has to be looked at. This is the only place those bytes are
       * visible, and the only place they can be removed without also throwing
       * away the queue record that explains them.
       */
      function downloadsView(snapshot) {
        const view = state.downloads
        if (!view) return '<div class="card"><div class="empty">正在读取暂存目录…</div></div>'
        const files = view.files || []
        const chosen = files.filter((file) => state.stagedSelected.has(file.itemId))
        const usedPercent =
          view.limitBytes > 0 ? Math.min(100, (view.usedBytes / view.limitBytes) * 100) : 0
        const stuck = files.filter((file) => file.complete && file.state !== 'complete').length

        return [
          '<div class="card">',
          '<div class="stats">',
          stat('本地文件', String(files.length)),
          stat('占用空间', bytes(view.usedBytes)),
          stat('暂存上限', view.limitBytes > 0 ? bytes(view.limitBytes) : '不限'),
          stat('已下完待上传', String(stuck)),
          stat('无主文件', view.orphanCount + ' 个 · ' + bytes(view.orphanBytes)),
          '</div>',
          view.limitBytes > 0
            ? '<div style="margin-top:.75rem;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden">' +
              '<div style="height:100%;width:' +
              usedPercent.toFixed(1) +
              '%;background:' +
              (usedPercent >= 90 ? 'var(--color-rust, #c0563b)' : 'var(--color-clay)') +
              '"></div></div>'
            : '',
          '<div class="hint">暂存目录 ' + esc(view.stageDir) + '。</div>',
          usedPercent >= 90
            ? '<div class="warn-box" style="margin-top:.75rem">暂存目录快满了。新的下载会一直等到腾出空间为止，先删掉这里不需要的文件。</div>'
            : '',
          '</div>',

          '<div class="toolbar">',
          '<p class="section-title" style="margin:0">暂存文件</p>',
          '<span class="grow"></span>',
          view.orphanCount > 0
            ? '<button class="btn btn-ghost" id="prune-staged" type="button">清理无主文件（' +
              view.orphanCount +
              '）</button>'
            : '',
          '</div>',

          '<div class="card" style="padding:0">',
          files.length === 0
            ? '<div class="empty">暂存目录是空的。上传成功后本地文件会按设置删除，失败的会留在这里等你处理。</div>'
            : stagedSelectionBar(files, chosen) +
              '<div class="rows" data-density="' +
                state.density +
                '">' +
                files.map((file) => stagedRow(file)).join('') +
                '</div>',
          '</div>',
          '<div class="hint">「占用空间」是文件真正吃掉的磁盘：未下完的文件一开始就按最终大小占位，所以它通常大于「已下载」。删除只动本地文件，队列记录和 tdrive 里已经传好的内容都不受影响。</div>',
        ].join('')
      }

      function stagedSelectionBar(files, chosen) {
        const removable = chosen.filter((file) => !file.running)
        const stateOf =
          chosen.length === 0 ? 'false' : chosen.length === files.length ? 'true' : 'mixed'
        return [
          '<div class="select-bar">',
          checkbox(stateOf, 'select-all-staged', chosen.length === files.length ? '取消全选' : '全选'),
          chosen.length > 0
            ? '<span>已选 ' + chosen.length + ' / ' + files.length + ' 项</span>'
            : '<span style="color:var(--muted)">' + files.length + ' 项</span>',
          '<span class="grow"></span>',
          removable.length > 0
            ? '<button class="btn btn-danger" id="bulk-delete-staged" type="button" style="padding:.25rem .5rem;font-size:.75rem">删除 ' +
              removable.length +
              ' 个本地文件</button>'
            : '',
          chosen.length > 0
            ? '<button class="btn btn-ghost" id="clear-staged-selection" type="button" style="padding:.25rem .5rem;font-size:.75rem">取消选择</button>'
            : '',
          '</div>',
        ].join('')
      }

      function stagedRow(file) {
        const percent = file.size > 0 ? Math.min(100, (file.downloaded / file.size) * 100) : 0
        const expanded = state.expanded.has('staged:' + file.itemId)
        const label = file.orphan
          ? '无主文件'
          : file.complete && file.state !== 'complete'
            ? '已下完，等待上传'
            : STATUS_LABEL[file.state] || '未知'

        return [
          '<div class="trow" data-row="staged:' + esc(file.itemId) + '">',
          percent > 0 ? '<div class="fill" style="width:' + percent.toFixed(1) + '%"></div>' : '',
          '<div class="body">',
          checkbox(
            state.stagedSelected.has(file.itemId) ? 'true' : 'false',
            '',
            (state.stagedSelected.has(file.itemId) ? '取消选择 ' : '选择 ') + (file.name || file.itemId),
            'staged:' + file.itemId,
          ),
          file.orphan ? ICONS.cancelled : ICONS[file.state] || ICONS.pending,
          '<span class="name" title="' + esc(file.path) + '">' +
            esc(file.name || file.itemId) +
            '</span>',
          file.orphan
            ? '<span class="chip">无主</span>'
            : '<span class="chip">' + esc(file.jobName || '任务') + '</span>',
          '<span class="meta">',
          esc(
            label +
              ' · 占用 ' +
              bytes(file.diskBytes) +
              (file.size > 0 ? ' · 已下载 ' + bytes(file.downloaded) + ' / ' + bytes(file.size) : ''),
          ),
          '</span>',
          // Retrying is the point of keeping the file, so it is offered right
          // where the file is rather than only back on the queue. Complete
          // items have already moved their file and cannot be retried.
          !file.orphan && !file.running && file.state !== 'complete'
            ? '<button class="btn btn-ghost" data-retry="' +
              esc(file.itemId) +
              '" style="padding:.25rem .5rem;font-size:.75rem">重试</button>'
            : '',
          !file.running
            ? '<button class="btn btn-ghost" data-delete-staged="' +
              esc(file.itemId) +
              '" style="padding:.25rem .5rem;font-size:.75rem">删除本地文件</button>'
            : '',
          '</div>',
          expanded
            ? '<dl class="detail">' +
              (file.remotePath ? detail('云端路径', file.remotePath) : '') +
              (file.targetPath ? detail('目标路径', file.targetPath) : '') +
              detail('本地路径', file.path) +
              detail('磁盘占用', bytes(file.diskBytes)) +
              detail('已下载', file.size > 0 ? bytes(file.downloaded) + ' / ' + bytes(file.size) : bytes(file.downloaded)) +
              detail('队列状态', file.orphan ? '队列里已经没有这条记录' : STATUS_LABEL[file.state] || '未知') +
              detail('尝试次数', String(file.attempts || 0)) +
              detail('最后修改', clock(file.modifiedAt)) +
              (file.error ? detail('错误', file.error) : '') +
              '</dl>'
            : '',
          '</div>',
        ].join('')
      }

      async function deleteStaged(ids, message) {
        try {
          await call('/downloads/delete', { method: 'POST', body: JSON.stringify({ ids }) })
          ids.forEach((id) => state.stagedSelected.delete(id))
          toast(message)
          await load(true)
        } catch (error) {
          toast(error.message, 'error')
        }
      }

      function jobsView(snapshot) {
        const jobs = snapshot.jobs || []
        return [
          '<div class="card">',
          '<div class="toolbar"><p class="section-title" style="margin:0">同步任务</p><span class="grow"></span>',
          '<button class="btn btn-primary" id="new-job" type="button">新建任务</button></div>',
          jobs.length === 0
            ? '<div class="empty">还没有任务。新建一个，指定要同步的云盘目录和 tdrive 里的落点。</div>'
            : jobs
                .map(
                  (job) =>
                    '<div class="job-row">' +
                    '<span class="dot" data-on="' + (job.enabled ? 'true' : 'false') + '"></span>' +
                    '<div style="flex:1;min-width:0">' +
                    '<div style="font-size:.875rem">' + esc(job.name) + '</div>' +
                    '<div class="hint mono">' +
                    esc(driveLabel(job.driveName)) +
                    ' · ' +
                    esc(job.remotePath) +
                    ' → ' +
                    esc(job.targetPath) +
                    '</div>' +
                    '</div>' +
                    (selectionChip(job) ? '<span class="chip">' + selectionChip(job) + '</span>' : '') +
                    (job.deleteAfterUpload
                      ? '<span class="chip danger-text">上传后删除云端</span>'
                      : '') +
                    '<button class="btn btn-ghost" data-edit-job="' + esc(job.id) + '" type="button">编辑</button>' +
                    '<button class="btn btn-danger" data-delete-job="' + esc(job.id) + '" type="button">删除</button>' +
                    '</div>',
                )
                .join(''),
          '</div>',
        ].join('')
      }

      function planView(snapshot) {
        const schedule = snapshot.schedule
        const quota = snapshot.quota
        const limits = snapshot.limits
        return [
          '<div class="card">',
          '<p class="section-title">同步窗口</p>',
          '<div class="form">',
          '<div><label class="switch"><input type="checkbox" id="schedule-enabled"' +
            (schedule.enabled ? ' checked' : '') +
            '> 启用计划任务</label>',
          '<div class="hint">关闭后不会开始任何新的传输。</div></div>',
          field('窗口开始', '<input class="input" id="window-start" placeholder="01:00" value="' + esc(schedule.windowStart) + '">', '留空表示全天可跑'),
          field('窗口结束', '<input class="input" id="window-end" placeholder="07:00" value="' + esc(schedule.windowEnd) + '">', '结束早于开始表示跨零点'),
          field('扫描间隔（分钟）', '<input class="input" id="interval" type="number" min="1" max="1440" value="' + schedule.intervalMinutes + '">', '窗口内每隔这么久重新扫描一次云盘'),
          '</div>',
          '<div class="hint" style="margin-top:.5rem">当前' +
            (schedule.open ? '在窗口内' : '不在窗口内') +
            (schedule.nextOpenAt ? '，下次开启 ' + esc(clock(schedule.nextOpenAt)) : '') +
            '。上次扫描 ' +
            esc(clock(snapshot.scan.lastScanAt)) +
            '。</div>',
          '</div>',

          '<div class="card">',
          '<p class="section-title">每日配额</p>',
          '<div class="form">',
          field('每日上传上限（GiB）', '<input class="input" id="quota-gib" type="number" min="0" step="0.5" value="' + (quota.dailyBytes > 0 ? (quota.dailyBytes / 1073741824).toFixed(2) : 0) + '">', '0 表示不限。只统计推送到 Telegram 的字节。'),
          field('配额重置时刻', '<input class="input" id="quota-reset" placeholder="00:00" value="' + esc(currentResetAt()) + '">', '每天到点归零'),
          '</div>',
          '<div class="hint" style="margin-top:.5rem">当前周期 ' +
            esc(quota.day) +
            '，已用 ' +
            esc(bytes(quota.usedBytes)) +
            '，' +
            esc(clock(quota.resetAt)) +
            ' 重置。</div>',
          '</div>',

          '<div class="card">',
          '<p class="section-title">暂存与归属</p>',
          '<div class="form">',
          field('暂存目录', '<input class="input" id="stage-dir" placeholder="' + esc(snapshot.stageDir) + '" value="' + esc((state.settings && state.settings.stageDir) || '') + '">', '留空使用插件数据目录下的 stage'),
          field('暂存上限（GiB）', '<input class="input" id="stage-limit" type="number" min="0" step="0.5" value="' + ((state.settings && state.settings.stageLimitBytes > 0) ? (state.settings.stageLimitBytes / 1073741824).toFixed(2) : 0) + '">', '0 表示跟随 tdrive 的暂存上限'),
          field('云盘下载限速', '<input class="input" id="download-rate" placeholder="例如 2MB" value="' + esc((state.settings && state.settings.downloadRate) || '') + '">', '源码客户端的总下载限速，留空表示不限速'),
          field('阿里云盘同时下载文件数', '<input class="input" id="aliyunpan-download-concurrency" type="number" min="1" max="32" step="1" value="' + ((state.settings && state.settings.downloadConcurrency) || 2) + '">', '限制同时从阿里云盘下载到本地的文件数，不影响 tdrive 自身的 Telegram 下载'),
          field('上传归属账号 ID', '<input class="input" id="owner" placeholder="留空使用第一个管理员" value="' + esc((state.settings && state.settings.ownerUserId) || '') + '">', '决定文件归谁、占谁的配额'),
          '<div><label class="switch"><input type="checkbox" id="delete-local-after-upload"' +
            (!state.settings || state.settings.deleteLocalAfterUpload !== false ? ' checked' : '') +
            '> 上传完成后立刻删除本地暂存文件</label>' +
            '<div class="hint">只有上传成功才会删除。上传失败的文件一律保留，可以在「下载文件」页查看和清理。</div></div>',
          '</div>',
          '</div>',

          '<div class="card">',
          '<p class="section-title">失败重试</p>',
          '<div class="form">',
          field('最多尝试次数', '<input class="input" id="retry-attempts" type="number" min="1" max="100" step="1" value="' + retrySetting('maxAttempts', 5) + '">', '包含第一次尝试，填 1 表示不自动重试'),
          field('首次重试间隔（秒）', '<input class="input" id="retry-initial" type="number" min="1" max="86400" step="1" value="' + retrySetting('initialSeconds', 30) + '">', '之后每次翻倍'),
          field('最大重试间隔（秒）', '<input class="input" id="retry-max" type="number" min="1" max="86400" step="1" value="' + retrySetting('maxSeconds', 1800) + '">', '退避时间的上限'),
          '</div>',
          '<div class="hint" style="margin-top:.5rem">下载和上传失败都会自动重试，已经下好的部分会保留下来续传，不会从头再来。次数用完才会记成「失败」，本地文件依然保留。重试的唤醒跟着 30 秒一次的调度走，所以实际等待会比设定值多最多 30 秒。</div>',
          '</div>',

          '<div class="toolbar"><span class="grow"></span><button class="btn btn-primary" id="save-plan" type="button">保存</button></div>',

          '<div class="card">',
          '<p class="section-title">tdrive 当前传输限制（同步会遵循这些参数）</p>',
          '<div class="stats">',
          stat('存储分片', bytes(limits.segmentSize)),
          stat('上传分片', bytes(limits.uploadPartSize)),
          stat('上传线程', String(limits.uploadThreads)),
          stat('同时上传文件', String(limits.uploadConcurrency)),
          stat('tdrive 同时下载文件', String(limits.downloadConcurrency)),
          stat('单文件下载连接', String(limits.maxDownloadConns)),
          stat('调用间隔', limits.rateLimitMillis > 0 ? limits.rateLimitMillis + ' ms' : '不限'),
          stat('tdrive 暂存上限', limits.cacheLimit > 0 ? bytes(limits.cacheLimit) : '不限'),
          '</div>',
          '<div class="hint" style="margin-top:.5rem">上面的“阿里云盘同时下载文件数”是插件自己的源下载限制；这里的 tdrive 参数请到「设置 → 性能参数 / 存储与暂存」修改。</div>',
          '</div>',
        ].join('')
      }

      function currentResetAt() {
        return (state.settings && state.settings.quota && state.settings.quota.resetAt) || '00:00'
      }

      // retrySetting falls back to the server's own defaults, because a
      // configuration written before this section existed has no retry object
      // at all and an empty number input would save a zero over it.
      function retrySetting(key, fallback) {
        const retry = state.settings && state.settings.retry
        return retry && retry[key] > 0 ? retry[key] : fallback
      }

      function field(label, control, hint) {
        return (
          '<div><label class="label">' +
          esc(label) +
          '</label>' +
          control +
          (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') +
          '</div>'
        )
      }

      function accountView(snapshot) {
        const account = snapshot.account
        const login = snapshot.login
        return [
          '<div class="card">',
          '<p class="section-title">阿里云盘源码客户端</p>',
          '<div class="stats">',
          stat('状态', '已内置'),
          stat('接口', 'OpenAPI'),
          stat('下载', '并行 Range'),
          '</div>',
          '<div class="hint" style="margin-top:.5rem">插件直接使用 Go 源码接入阿里云盘，不再下载、启动或依赖 aliyunpan 独立二进制。</div>',
          '</div>',

          '<div class="card">',
          '<p class="section-title">阿里云盘账号</p>',
          account.loggedIn
            ? '<div class="stats">' +
              stat('昵称', account.nickname || '—') +
              stat('UID', account.userId || '—') +
              stat('网盘', account.driveName || '—') +
              stat(
                '可用网盘',
                (account.drives || []).map((drive) => drive.name || driveLabel(drive.kind)).join('、') || '—',
              ) +
              '</div>' +
              '<div class="toolbar" style="margin-top:.75rem"><button class="btn btn-danger" id="logout-btn" type="button">退出登录</button>' +
              '<button class="btn btn-ghost" id="refresh-account" type="button">刷新</button></div>'
            : loginPanel(login),
          account.error ? '<div class="error-box" style="margin-top:.5rem">' + esc(account.error) + '</div>' : '',
          '</div>',
        ].join('')
      }

      function loginPanel(login) {
        if (login && login.active && login.url) {
          return [
            '<div class="hint">在浏览器里打开下面的链接完成授权和扫码，然后回到这里点「我已完成登录」。链接 5 分钟内有效',
            login.expiresAt ? '（' + esc(clock(new Date(login.expiresAt).getTime())) + ' 失效）' : '',
            '。</div>',
            '<div class="mono" style="margin:.5rem 0;padding:.5rem;background:var(--sunk);border-radius:var(--radius-control)">' +
              esc(login.url) +
              '</div>',
            '<div class="toolbar">',
            '<a class="btn btn-outline" href="' + esc(login.url) + '" target="_blank" rel="noopener noreferrer">打开链接</a>',
            '<button class="btn btn-ghost" id="copy-login" type="button">复制链接</button>',
            '<span class="grow"></span>',
            '<button class="btn btn-ghost" id="cancel-login" type="button">取消</button>',
            '<button class="btn btn-primary" id="confirm-login" type="button"' +
              (login.phase === 'finishing' ? ' disabled' : '') +
              '>' +
              (login.phase === 'finishing' ? '正在换取令牌…' : '我已完成登录') +
              '</button>',
            '</div>',
          ].join('')
        }
        return [
          login && login.error ? '<div class="error-box" style="margin-bottom:.5rem">' + esc(login.error) + '</div>' : '',
          '<div class="hint">还没有绑定阿里云盘账号。</div>',
          '<div class="toolbar" style="margin-top:.75rem"><button class="btn btn-primary" id="start-login" type="button">扫码登录</button></div>',
        ].join('')
      }

      // ------------------------------------------------------------- overlays

      // renderOverlay repaints only when the overlay's identity changes. The
      // job form lives in the DOM rather than in state until it is saved, so
      // an unconditional repaint on every poll would discard half-typed input.
      // The picker is checked first: it opens on top of the job form, and the
      // form has to still be there underneath when the picker closes.
      function renderOverlay(force) {
        const overlay = document.getElementById('overlay')
        const previousPicker = overlay.querySelector('.picker')
        const previousModal = previousPicker ? overlay.querySelector('.modal') : null
        const previousPickerPath = previousPicker ? previousPicker.dataset.pickerPath || '' : ''
        const previousPickerScrollTop = previousPicker ? previousPicker.scrollTop : 0
        const previousModalScrollTop = previousModal ? previousModal.scrollTop : 0
        const key = state.picker
          ? ['picker', state.picker.request, state.picker.kind, state.picker.driveName, state.picker.path, state.picker.loading, state.picker.error, state.picker.chosen.size].join('|')
          : state.editing
            ? 'job|' + (state.editing.id || 'new') +
              '|' + ((state.editing.includeFiles || []).length) +
              '|' + ((state.editing.includeDirs || []).length)
            : ''
        if (!force && key === overlayKey) return
        overlayKey = key

        if (state.picker) {
          overlay.innerHTML = pickerModal(state.picker)
          const nextPicker = overlay.querySelector('.picker')
          if (nextPicker && previousPicker && nextPicker.dataset.pickerPath === previousPickerPath) {
            nextPicker.scrollTop = previousPickerScrollTop
            const nextModal = overlay.querySelector('.modal')
            if (nextModal) nextModal.scrollTop = previousModalScrollTop
          }
        } else if (state.editing) overlay.innerHTML = jobModal(state.editing)
        else overlay.innerHTML = ''
      }

      function jobModal(job) {
        return [
          '<div class="modal-backdrop" data-close-modal="1"><div class="modal">',
          '<h2>' + (job.id ? '编辑任务' : '新建任务') + '</h2>',
          '<div class="form">',
          field('名称', '<input class="input" id="job-name" value="' + esc(job.name || '') + '">'),
          '<div><label class="switch"><input type="checkbox" id="job-enabled"' +
            (job.enabled !== false ? ' checked' : '') +
            '> 启用</label></div>',
          field(
            '云盘',
            '<select class="input" id="job-drive">' + driveOptions(job.driveName || 'backup') + '</select>',
            '每个任务独立选择备份盘或资源库，不依赖 aliyunpan 当前工作盘',
          ),
          '<div class="field-wide">' +
            '<label class="label">云盘目录</label>' +
            '<div class="toolbar"><input class="input" id="job-remote" value="' + esc(job.remotePath || '/') + '">' +
            '<button class="btn btn-outline" data-pick="remote" type="button">浏览</button></div>' +
            includedFilesField(job) +
            '</div>',
          '<div class="field-wide">' +
            '<label class="label">tdrive 目标目录</label>' +
            '<div class="toolbar"><input class="input" id="job-target" value="' + esc(job.targetPath || '/') + '">' +
            '<button class="btn btn-outline" data-pick="target" type="button">浏览</button></div></div>',
          field('最小文件（MiB）', '<input class="input" id="job-min" type="number" min="0" value="' + ((job.minSizeBytes || 0) / 1048576).toFixed(0) + '">', '0 表示不限'),
          field('最大文件（MiB）', '<input class="input" id="job-max" type="number" min="0" value="' + ((job.maxSizeBytes || 0) / 1048576).toFixed(0) + '">', '0 表示不限'),
          '<div class="field-wide">' +
            field(
              '排除规则',
              '<input class="input" id="job-exclude" value="' + esc((job.excludeNames || []).join(', ')) + '">',
              '按名称匹配的正则，多个用逗号分隔；匹配到的目录不会被进入',
            ) +
            '</div>',
          '<div><label class="switch"><input type="checkbox" id="job-overwrite"' +
            (job.overwrite ? ' checked' : '') +
            '> 大小不同时覆盖 tdrive 里已有的同名文件</label></div>',
          '<div><label class="switch"><input type="checkbox" id="job-delete"' +
            (job.deleteAfterUpload ? ' checked' : '') +
            '> <span class="danger-text">上传成功后删除云端原文件</span></label>',
          '<div class="hint">只有在 tdrive 确认写入之后才会删除。这一步不可撤销。</div></div>',
          '</div>',
          '<div class="modal-actions">',
          '<button class="btn btn-outline" data-close-modal="1" type="button">取消</button>',
          '<button class="btn btn-primary" id="save-job" type="button">保存</button>',
          '</div>',
          '</div></div>',
        ].join('')
      }

      /**
       * includedFilesField reports whether the job is mirroring a directory or
       * syncing a hand-picked selection, because those behave very differently
       * and the difference is otherwise invisible on the form.
       */
      function includedFilesField(job) {
        const dirs = job.includeDirs || []
        const files = job.includeFiles || []
        const picked = [...dirs.map((path) => path + '/'), ...files]
        if (picked.length === 0) {
          return '<div class="hint">同步整个目录（含子目录）。用「浏览」勾选目录或文件可以只同步其中几项。</div>'
        }
        const counts = [
          dirs.length > 0 ? dirs.length + ' 个目录' : '',
          files.length > 0 ? files.length + ' 个文件' : '',
        ].filter(Boolean).join('、')
        const preview = picked.slice(0, 6).map((path) => '<div>' + esc(path) + '</div>').join('')
        return (
          '<div class="warn-box" style="margin-top:.5rem">' +
          '<div class="toolbar"><span>只同步勾选的 ' + counts + '</span><span class="grow"></span>' +
          '<button class="btn btn-ghost" id="job-clear-files" type="button" style="padding:.125rem .375rem;font-size:.75rem">改为整个目录</button></div>' +
          '<div class="mono" style="margin-top:.375rem;color:inherit">' +
          preview +
          (picked.length > 6 ? '<div>…还有 ' + (picked.length - 6) + ' 项</div>' : '') +
          '</div>' +
          (dirs.length > 0
            ? '<div class="hint" style="margin:.375rem 0 0">勾选的目录会连同子目录一起同步，目录结构原样保留到目标目录下。</div>'
            : '') +
          '</div>'
        )
      }

      function pickerModal(picker) {
        const remote = picker.kind === 'remote'
        const chosen = picker.chosen ? picker.chosen.size : 0
        const entries = picker.entries || []
        const here = remote ? entries : []
        const allHereChosen = here.length > 0 && here.every((entry) => picker.chosen.has(entry.path))

        const row = (entry) => {
          const ticked = picker.chosen.has(entry.path)
          if (entry.isDir) {
            // The tdrive side is only ever a destination, so a directory there
            // is entered and nothing else.
            if (!remote) {
              return (
                '<button data-picker-go="' + esc(entry.path) + '" type="button">📁 ' +
                esc(entry.name) + '</button>'
              )
            }
            // A cloud directory can be entered or taken whole, so the tick and
            // the way in are separate targets on the same row.
            return (
              '<div class="picker-row">' +
              '<button class="check-hit" data-pick-dir="' + esc(entry.path) + '" type="button" ' +
              'aria-label="勾选整个目录" title="连同子目录一起同步">' +
              '<span class="check" data-on="' + (ticked ? 'true' : 'false') + '">' +
              (ticked ? '✓' : '') +
              '</span></button>' +
              '<button data-picker-go="' + esc(entry.path) + '" type="button">📁 ' +
              esc(entry.name) + '</button></div>'
            )
          }
          // A file is ticked, not entered, so the whole row toggles it.
          return (
            '<button data-pick-file="' + esc(entry.path) + '" type="button">' +
            '<span class="check" data-on="' + (ticked ? 'true' : 'false') + '">' +
            (ticked ? '✓' : '') +
            '</span>📄 ' + esc(entry.name) +
            '<span class="size">' + esc(bytes(entry.size)) + '</span></button>'
          )
        }

        return [
          '<div class="modal-backdrop" data-close-modal="1"><div class="modal">',
          '<h2>' + (remote ? '选择' + driveLabel(picker.driveName) + '目录或文件' : '选择 tdrive 目录') + '</h2>',
          '<div class="mono" style="margin-bottom:.5rem">' + esc(picker.path) + '</div>',
          remote
            ? '<div class="hint" style="margin:-.25rem 0 .5rem">不勾选任何内容就同步整个目录；勾选目录会连同它的子目录一起同步，勾选可以跨目录保留。</div>'
            : '',
          picker.error ? '<div class="error-box">' + esc(picker.error) + '</div>' : '',
          remote && here.length > 0 && !picker.loading
            ? '<div class="toolbar" style="margin-bottom:.375rem">' +
              checkbox(
                allHereChosen ? 'true' : chosen > 0 ? 'mixed' : 'false',
                'picker-select-all',
                allHereChosen ? '取消全选' : '全选本目录',
              ) +
              '<span class="hint" style="margin:0">' +
              (chosen > 0 ? '已勾选 ' + chosen + ' 项' : here.length + ' 项') +
              '</span></div>'
            : '',
          '<div class="picker" data-picker-path="' + esc(picker.path) + '">',
          picker.path !== '/'
            ? '<button data-picker-go="' + esc(parentOf(picker.path)) + '" type="button">.. 上一级</button>'
            : '',
          picker.loading
            ? '<button type="button" disabled>加载中…</button>'
            : entries.map(row).join('') ||
              '<button type="button" disabled>' + (remote ? '这个目录是空的' : '这里没有子目录') + '</button>',
          '</div>',
          '<div class="modal-actions">',
          chosen > 0
            ? '<button class="btn btn-ghost" id="picker-clear" type="button">清空勾选</button>'
            : '',
          '<button class="btn btn-outline" data-close-modal="1" type="button">取消</button>',
          '<button class="btn btn-primary" id="picker-choose" type="button">' +
            (chosen > 0 ? '使用勾选的 ' + chosen + ' 项' : '选择当前目录') +
            '</button>',
          '</div>',
          '</div></div>',
        ].join('')
      }

      function parentOf(path) {
        const trimmed = path.replace(/\/+$/, '')
        const index = trimmed.lastIndexOf('/')
        return index <= 0 ? '/' : trimmed.slice(0, index)
      }

      // --------------------------------------------------------------- events

      document.addEventListener('click', async (event) => {
        const target = event.target.closest('[data-tab],[data-filter],[data-row],[data-retry],[data-cancel],[data-check],[data-delete-staged],[data-pick-file],[data-pick-dir],[data-edit-job],[data-delete-job],[data-pick],[data-picker-go],[data-close-modal],button,a')
        if (!target) return

        if (target.dataset.check !== undefined) {
          // Ticking a row must not also expand it, which is what a click
          // anywhere else on the row does.
          event.stopPropagation()
          const id = target.dataset.check
          // The two lists share item ids but not their selections, so a staged
          // file's tick is prefixed rather than pooled with the queue's.
          if (id.startsWith('staged:')) {
            const itemID = id.slice('staged:'.length)
            if (state.stagedSelected.has(itemID)) state.stagedSelected.delete(itemID)
            else state.stagedSelected.add(itemID)
          } else if (state.selected.has(id)) {
            state.selected.delete(id)
          } else {
            state.selected.add(id)
          }
          render()
          return
        }
        if (target.dataset.deleteStaged) {
          event.stopPropagation()
          const file = ((state.downloads && state.downloads.files) || []).find(
            (entry) => entry.itemId === target.dataset.deleteStaged,
          )
          const name = (file && (file.name || file.itemId)) || target.dataset.deleteStaged
          const warning =
            file && file.complete && file.state !== 'complete'
              ? '「' + name + '」已经下载完成，只差上传。删掉本地文件意味着重试时要从阿里云盘重新下一遍。确定删除吗？'
              : '删除「' + name + '」的本地文件？队列记录会保留，重试会重新下载。'
          if (!window.confirm(warning)) return
          await deleteStaged([target.dataset.deleteStaged], '本地文件已删除')
          return
        }
        if (target.dataset.pickFile !== undefined || target.dataset.pickDir !== undefined) {
          event.stopPropagation()
          const isDir = target.dataset.pickDir !== undefined
          togglePicked(isDir ? target.dataset.pickDir : target.dataset.pickFile, isDir)
          renderOverlay(true)
          return
        }
        if (target.dataset.tab) {
          state.tab = target.dataset.tab
          localStorage.setItem('tdrive.aliyunpan.tab', state.tab)
          if (state.tab === 'plan') await loadSettings()
          if (state.tab === 'downloads') {
            // Entering the tab has to fetch its data, which the previous poll
            // deliberately skipped.
            render()
            await load(true)
            return
          }
          render()
          return
        }
        if (target.dataset.filter) {
          const key = target.dataset.filter
          if (state.filters.has(key)) state.filters.delete(key)
          else state.filters.add(key)
          render()
          return
        }
        if (target.dataset.retry) {
          event.stopPropagation()
          await act('/queue/retry?id=' + encodeURIComponent(target.dataset.retry), null, '已重新排队')
          return
        }
        if (target.dataset.cancel) {
          event.stopPropagation()
          await act('/queue/cancel?id=' + encodeURIComponent(target.dataset.cancel), null, '已取消')
          return
        }
        if (target.dataset.closeModal !== undefined) {
          // A click inside the modal also finds the backdrop when walking up,
          // so only the backdrop itself and the explicit cancel buttons close
          // anything. The picker closes back onto the job form rather than
          // dismissing both.
          if (target.tagName === 'BUTTON' || event.target === target) {
            if (state.picker) state.picker = null
            else state.editing = null
            renderOverlay(true)
          }
          return
        }
        if (target.dataset.pick) {
          captureJobForm()
          const kind = target.dataset.pick
          openPicker(kind, kind === 'remote' ? state.editing.remotePath || '/' : state.editing.targetPath || '/')
          return
        }
        if (target.dataset.pickerGo !== undefined) {
          openPicker(state.picker.kind, target.dataset.pickerGo)
          return
        }
        if (target.dataset.editJob) {
          const job = (state.snapshot.jobs || []).find((item) => item.id === target.dataset.editJob)
          state.editing = job ? { ...job } : null
          renderOverlay(true)
          return
        }
        if (target.dataset.deleteJob) {
          const job = (state.snapshot.jobs || []).find((item) => item.id === target.dataset.deleteJob)
          if (!window.confirm('删除任务「' + (job ? job.name : '') + '」？已完成的文件会留在 tdrive 里。')) return
          try {
            await call('/jobs?id=' + encodeURIComponent(target.dataset.deleteJob), { method: 'DELETE' })
            toast('任务已删除')
            await load(true)
          } catch (error) {
            toast(error.message, 'error')
          }
          return
        }

        switch (target.id) {
          case 'scan-btn':
            await act('/scan', null, '已开始扫描')
            return
          case 'pause-btn':
            await act(target.dataset.paused === 'true' ? '/resume' : '/pause', null, null)
            return
          case 'density-btn':
            state.density = state.density === 'compact' ? 'comfortable' : 'compact'
            localStorage.setItem('tdrive.transferDensity', state.density)
            render()
            return
          case 'clear-btn':
            await act('/queue/clear', null, '历史已清空')
            state.selected.clear()
            return
          case 'select-all-rows': {
            const visible = visibleRowIds()
            const allChosen = visible.length > 0 && visible.every((id) => state.selected.has(id))
            if (allChosen) visible.forEach((id) => state.selected.delete(id))
            else visible.forEach((id) => state.selected.add(id))
            render()
            return
          }
          case 'clear-selection':
            state.selected.clear()
            render()
            return
          case 'select-all-staged': {
            const files = ((state.downloads && state.downloads.files) || []).map((file) => file.itemId)
            const allChosen = files.length > 0 && files.every((id) => state.stagedSelected.has(id))
            if (allChosen) files.forEach((id) => state.stagedSelected.delete(id))
            else files.forEach((id) => state.stagedSelected.add(id))
            render()
            return
          }
          case 'clear-staged-selection':
            state.stagedSelected.clear()
            render()
            return
          case 'bulk-delete-staged': {
            const removable = ((state.downloads && state.downloads.files) || []).filter(
              (file) => state.stagedSelected.has(file.itemId) && !file.running,
            )
            if (removable.length === 0) {
              toast('选中的文件都在传输中，请先取消', 'error')
              return
            }
            const total = removable.reduce((sum, file) => sum + file.diskBytes, 0)
            if (
              !window.confirm(
                '删除 ' + removable.length + ' 个本地文件，释放 ' + bytes(total) +
                  '？队列记录会保留，重试会重新下载。',
              )
            ) {
              return
            }
            await deleteStaged(removable.map((file) => file.itemId), '本地文件已删除')
            return
          }
          case 'prune-staged':
            if (!window.confirm('删除队列里已经没有对应记录的暂存文件？这些文件不属于任何一条传输。')) return
            try {
              const result = await call('/downloads/prune', { method: 'POST' })
              toast('已清理 ' + result.count + ' 项，释放 ' + bytes(result.bytes))
              await load(true)
            } catch (error) {
              toast(error.message, 'error')
            }
            return
          case 'bulk-retry':
            await bulkQueue(
              '/queue/retry',
              (row) => row.state !== 'running' && row.state !== 'complete',
              '已重新排队',
            )
            return
          case 'bulk-cancel': {
            const stopping = selectedRows().filter((row) => !FINISHED_STATES.has(row.state))
            const running = stopping.filter((row) => row.state === 'running').length
            if (
              running > 0 &&
              !window.confirm(
                '其中 ' + running + ' 个文件正在传输，取消会中断它们并删除 tdrive 里已写入的部分。继续吗？',
              )
            ) {
              return
            }
            await bulkQueue('/queue/cancel', (row) => !FINISHED_STATES.has(row.state), '已取消')
            return
          }
          case 'bulk-delete': {
            const removable = selectedRows().filter((row) => FINISHED_STATES.has(row.state))
            if (!window.confirm('删除选中的 ' + removable.length + ' 条记录？文件本身留在 tdrive 里。')) return
            await bulkQueue('/queue/delete', (row) => FINISHED_STATES.has(row.state), '记录已删除')
            return
          }
          case 'new-job':
            state.editing = {
              enabled: true, driveName: 'backup', remotePath: '/',
              targetPath: '/阿里云盘', includeFiles: [], includeDirs: [],
            }
            renderOverlay(true)
            return
          case 'save-job':
            await saveJob()
            return
          case 'job-clear-files':
            captureJobForm()
            state.editing.includeFiles = []
            state.editing.includeDirs = []
            renderOverlay(true)
            return
          case 'picker-choose':
            applyPicker()
            return
          case 'picker-select-all': {
            const here = state.picker.entries || []
            const allChosen = here.length > 0 && here.every((entry) => state.picker.chosen.has(entry.path))
            here.forEach((entry) => {
              if (allChosen) state.picker.chosen.delete(entry.path)
              else state.picker.chosen.set(entry.path, entry.isDir ? 'dir' : 'file')
            })
            renderOverlay(true)
            return
          }
          case 'picker-clear':
            state.picker.chosen.clear()
            renderOverlay(true)
            return
          case 'save-plan':
            await savePlan()
            return
          case 'start-login':
            await act('/login/start', null, null)
            return
          case 'confirm-login':
            await act('/login/confirm', null, null)
            return
          case 'cancel-login':
            await act('/login/cancel', null, '已取消登录')
            return
          case 'copy-login':
            try {
              await navigator.clipboard.writeText(state.snapshot.login.url)
              toast('链接已复制')
            } catch (error) {
              toast('复制失败，请手动选中链接', 'error')
            }
            return
          case 'logout-btn':
            if (!window.confirm('退出阿里云盘账号？同步会停止，直到重新登录。')) return
            await act('/logout', null, '已退出')
            return
          case 'refresh-account':
            try {
              await call('/account')
              await load(true)
            } catch (error) {
              toast(error.message, 'error')
            }
            return
        }

        const row = target.closest('[data-row]')
        if (row) {
          const id = row.dataset.row
          if (state.expanded.has(id)) state.expanded.delete(id)
          else state.expanded.add(id)
          render()
        }
      })

      document.addEventListener('change', (event) => {
        if (event.target.id === 'job-filter') {
          state.jobFilter = event.target.value
          render()
        }
      })

      // ------------------------------------------------------------ selection

      /** visibleRows is the queue under the current filters — the same list the
       *  view draws, so "全选" cannot select something that is not on screen. */
      function visibleRows() {
        const rows = (state.snapshot && state.snapshot.rows) || []
        return rows
          .filter((row) => (state.filters.size === 0 ? true : state.filters.has(row.state)))
          .filter((row) => (state.jobFilter ? row.jobId === state.jobFilter : true))
      }

      function visibleRowIds() {
        return visibleRows().map((row) => row.id)
      }

      function selectedRows() {
        return visibleRows().filter((row) => state.selected.has(row.id))
      }

      /**
       * bulkQueue posts one request for every selected row an action can apply
       * to, and drops those rows from the selection afterwards.
       *
       * The rows that do not qualify are filtered out here rather than being
       * sent and rejected: selecting a screenful and pressing 取消 should stop
       * what can be stopped, not fail because one row had already finished.
       */
      async function bulkQueue(endpoint, applies, message) {
        const ids = selectedRows().filter(applies).map((row) => row.id)
        if (ids.length === 0) {
          toast('选中的项目都不适用这个操作', 'error')
          return
        }
        try {
          await call(endpoint, { method: 'POST', body: JSON.stringify({ ids }) })
          ids.forEach((id) => state.selected.delete(id))
          toast(message + ' ' + ids.length + ' 项')
          await load(true)
        } catch (error) {
          toast(error.message, 'error')
        }
      }

      // ---------------------------------------------------------------- forms

      async function loadSettings() {
        try {
          state.settings = await call('/settings')
        } catch (error) {
          toast(error.message, 'error')
        }
      }

      function value(id) {
        const element = document.getElementById(id)
        return element ? element.value.trim() : ''
      }

      function checked(id) {
