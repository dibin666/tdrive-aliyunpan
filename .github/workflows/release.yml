name: release

# tdrive does not compile plugins. It downloads a release binary, checks it
# against the SHA-256 in the published manifest, and only then executes it —
# so building the artifacts and pinning their digests is this repository's job.
#
# Versioning follows the main program: every commit on main becomes a release,
# with the patch number incremented from the newest existing tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish plugin binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # The host and the plugin have to agree on the SDK, so the toolchain
          # follows the go directive rather than a version pinned here.
          go-version-file: go.mod

      # Everything that can fail without burning a version number runs before
      # the tag is created.
      - name: Vet and test
        run: |
          set -euo pipefail
          go vet ./...
          # The Windows binaries are cross-compiled and never executed here, so
          # vet is the only thing standing between a GOOS-specific mistake and
          # a published artifact that cannot start.
          GOOS=windows go vet ./...
          go test ./...

      - name: Create release version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force

          current="$(git tag --points-at "$GITHUB_SHA" --sort=-v:refname \
            | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [ -n "$current" ]; then
            tag="$current"
            version="${current#v}"
          else
            latest="$(git tag --list 'v*' --sort=-v:refname \
              | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              value="${latest#v}"
              IFS=. read -r major minor patch <<< "$value"
              version="$major.$minor.$((patch + 1))"
            fi

            tag="v$version"
            while git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; do
              IFS=. read -r major minor patch <<< "$version"
              version="$major.$minor.$((patch + 1))"
              tag="v$version"
            done

            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$tag" "$GITHUB_SHA" -m "Release $version"
            git push origin "$tag"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the binaries and pin them in the published manifest
        id: manifest
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # The committed manifest is a placeholder; the published one is
          # generated here so its version, its artifact URLs and the binaries
          # beside them all come from the tag this run just created. It is
          # rewritten in place because the next step's tests read it from the
          # working tree.
          jq --arg v "$VERSION" '.version = $v' tdrive.plugin.json > "$RUNNER_TEMP/manifest.tmp"
          mv "$RUNNER_TEMP/manifest.tmp" tdrive.plugin.json

          # The artifact keys are the platform list: adding a platform is one
          # edit in tdrive.plugin.json and this loop follows it.
          for platform in $(jq -r '.artifacts | keys[]' tdrive.plugin.json); do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            asset="tdrive-aliyunpan-$goos-$goarch"
            # tdrive renames whatever it downloads, so this suffix is only for
            # a human who fetches the asset directly — but on Windows that is
            # the difference between a runnable file and one Explorer will not
            # open.
            if [ "$goos" = windows ]; then
              asset="$asset.exe"
            fi

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -buildvcs=false -ldflags "-X main.version=$VERSION" \
              -o "dist/$asset" ./cmd/tdrive-aliyunpan

            # A binary cannot contain its own hash, so the digest can only be
            # computed once the binary exists.
            digest="$(sha256sum "dist/$asset" | cut -d' ' -f1)"
            jq --arg p "$platform" --arg d "$digest" \
              --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset" \
              '.artifacts[$p].url = $u | .artifacts[$p].sha256 = $d' \
              tdrive.plugin.json > "$RUNNER_TEMP/manifest.tmp"
            mv "$RUNNER_TEMP/manifest.tmp" tdrive.plugin.json
          done

          cp tdrive.plugin.json dist/tdrive.plugin.json
          echo "digest=$(sha256sum dist/tdrive.plugin.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check the artifact against the published manifest
        run: |
          set -euo pipefail
          # tdrive refuses to start a plugin whose reported manifest differs
          # from the installed JSON, and an install that fails that late has
          # already burned a version number. So the linux/amd64 artifact is
          # driven through a real go-plugin handshake here and its manifest
          # compared against the rewritten file — the same pair, and the same
          # comparison, the host will make after an install.
          TDRIVE_PLUGIN_TEST_BINARY="$PWD/dist/tdrive-aliyunpan-linux-amd64" \
            go test -count=1 ./cmd/tdrive-aliyunpan/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          manifest_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/tdrive.plugin.json"

          {
            echo "在 tdrive「设置 → 插件 → 安装插件」粘贴这个清单地址："
            echo
            echo '```'
            echo "$manifest_url"
            echo '```'
            echo
            echo "总是装最新版就用这个地址（它跟着 latest 走，不是固定版本）："
            echo
            echo '```'
            echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/tdrive.plugin.json"
            echo '```'
            echo
            echo "清单 SHA-256（插件商店索引里的 \`manifestDigest\`）：\`$MANIFEST_DIGEST\`"
            echo
            echo "| 平台 | 二进制 SHA-256 |"
            echo "|---|---|"
            # Read the table back out of the manifest, so it can only describe
            # what was actually published.
            jq -r '.artifacts | to_entries | sort_by(.key)[]
              | "| \(.key) | `\(.value.sha256)` |"' dist/tdrive.plugin.json
          } > "$notes"

          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file "$notes"

          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
